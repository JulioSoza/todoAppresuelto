name: Demo 05 - Coverage 80% (Profesional)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      COVERAGE_THRESHOLD: 80

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm run test -- --coverage

      - name: Analyze coverage threshold
        run: |
          echo "Analizando coverage"
          echo "Coverage threshold: ${{ env.COVERAGE_THRESHOLD }}"
          echo "Ejecutando validación de cobertura..."
          npm run coverage
