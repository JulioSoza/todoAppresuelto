# Demo 05 - Coverage Alto (80%)
# Aquí la mayoría de proyectos fallan - Es educativo

name: Demo 05 - Coverage 80% (Profesional)

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  coverage-profesional:
    name: "Coverage Profesional (80%)"
    runs-on: ubuntu-latest

    steps:
      # 1. Setup básico
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # 2. Ejecutar tests con coverage y threshold del 80% (definido en Jest)
      - name: Ejecutar tests con coverage (80% líneas)
        run: |
          echo "Ejecutando tests con coverage..."
          echo "El threshold del 80% en líneas está configurado en Jest (coverageThreshold.global.lines)."
          npm run test:coverage
