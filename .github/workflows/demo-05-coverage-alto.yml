name: Demo 05 - Coverage 80% (Profesional)

on:
  push:
    branches: [ main, 'feature/*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage (threshold 80 % en Jest)
        run: |
          echo "Ejecutando tests con coverage (threshold 80 % de líneas definido en Jest)..."
          npm run test:coverage
