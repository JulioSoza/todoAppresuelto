name: Demo 05 - Coverage 80% (Profesional)

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main

jobs:
  coverage-80:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
git add .github/workflows/demo-05-coverage-alto.yml
git commit -m "Simplify Demo 05 workflow to basic 80% coverage"
git push origin main
